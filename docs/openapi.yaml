openapi: 3.0.3
info:
  title: MIRA FEB Backend API Specification
  description: >
    Dokumentasi Lengkap API Specification (Phase 1, 2, dan 3) untuk backend Express.js MIRA FEB (Fakultas Ekonomi dan Bisnis).
    Menjangkau seluruh modul dari Autentikasi Publik, Pengguna, Tiket Pengaduan, Pengingat Jadwal, Kontak, Dokumen Kemitraan (Partnership), Google Calendar, Evaluasi Kontrak Kinerja Unit, Monitoring Konflik Kegiatan Ruang & Pejabat, Notulensi Rapat, Data Master Dosen & TPA, HaloDekan Multi-Role Workflow (Mahasiswa, Admin, Dekanat, Unit Kerja), hingga Manajemen Struktural Unit.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local Development Server
  - url: https://mira-feb-backend-six.vercel.app/api
    description: Production Server

security:
  - bearerAuth: []

tags:
  - name: Public Auth
    description: Endpoint autentikasi publik yang tidak memerlukan token akses.
  - name: Protected Auth & Accounts
    description: Endpoint pengaturan akun dan integrasi Google (Memerlukan login).
  - name: Protected Users
    description: Manajemen data pengguna dan profil (Memerlukan login).
  - name: Protected Tickets
    description: Manajemen pelaporan / Tiket Pengaduan dan Dashboard (Memerlukan login & wewenang admin).
  - name: Protected Schedules
    description: Manajemen jadwal pengingat / Reminder (Memerlukan login).
  - name: Protected Contacts
    description: Data kontak civitas akademika (Memerlukan login).
  - name: Protected Partnership
    description: Dokumen kerjasama / kemitraan MoA, MoU, IA (Memerlukan login).
  - name: Protected Google Calendar
    description: Sinkronisasi agenda rapat ke Google Calendar (Memerlukan login).
  - name: Protected Contract Management
    description: Evaluasi kinerja unit / Contract Kinerja (Memerlukan login).
  - name: Protected Activity Monitoring
    description: Monitoring konflik jadwal kegiatan ruangan & pejabat (Memerlukan login).
  - name: Protected Management Reports
    description: Checklist status laporan manajemen tahunan (Memerlukan login).
  - name: Protected Meetings
    description: Notulensi & action items rapat (Memerlukan login).
  - name: Protected Lecturers & Staffs
    description: Data master Dosen dan Tenaga Penunjang Akademik (TPA) (Memerlukan login).
  - name: Protected HaloDekan
    description: Sistem Pelaporan Halo Dekan terintegrasi multi-role (Mahasiswa, Admin, Dekanat, Unit).
  - name: Protected Units
    description: Manajemen data unit struktural FEB Telkom University.

paths:
  # ================= PUBLIC ROUTES =================
  /sign-in:
    post:
      tags:
        - Public Auth
      summary: Sign in with credentials
      description: Mengautentikasi pengguna menggunakan username dan password, mengembalikan info user dan menetapkan cookie `auth_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "admin_feb"
                password:
                  type: string
                  example: "securePassword123"
      responses:
        '200':
          description: Login berhasil, cookie auth_token telah diset.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "auth_token=eyJhbGciOiJIUzI1Ni...; HttpOnly; Secure; SameSite=None; Max-Age=86400"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  user:
                    $ref: '#/components/schemas/UserBasic'
        '400':
          description: Username dan password wajib diisi.
        '401':
          description: Username atau password salah.
        '500':
          description: Terjadi kesalahan pada server.

  /google/login:
    get:
      tags:
        - Public Auth
      summary: Initiate Google OAuth flow
      description: Mengalihkan pengguna ke halaman persetujuan Google OAuth untuk integrasi Kalender.
      security: []
      responses:
        '302':
          description: Dialihkan ke Google OAuth URL.

  /google/redirect:
    get:
      tags:
        - Public Auth
      summary: Handle Google OAuth callback
      description: Endpoint callback setelah otorisasi Google. Menerima code, menyimpan token, dan mengalihkan pengguna kembali ke frontend.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Kode otorisasi dari Google.
          schema:
            type: string
      responses:
        '302':
          description: Redirect ke dashboard frontend dengan status koneksi (connected=true/false).

  /auth/google:
    post:
      tags:
        - Public Auth
      summary: Authenticate with Google Token
      description: >
        Login atau registrasi otomatis menggunakan token dari Google.
        Hanya mengizinkan alamat email resmi Telkom University (@student.telkomuniversity.ac.id atau @telkomuniversity.ac.id).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Google ID Token / Access Token.
                  example: "ya29.a0AeD3V_..._token"
      responses:
        '200':
          description: Autentikasi Google berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful with Google Auth"
                  user:
                    $ref: '#/components/schemas/UserBasic'
        '400':
          description: Google Token tidak ditemukan.
        '403':
          description: Domain email tidak terdaftar atau bukan email resmi Telkom University.
        '500':
          description: Terjadi kesalahan server.

  /auth/otp/request:
    post:
      tags:
        - Public Auth
      summary: Request OTP code via email
      description: Mengirimkan 6 digit kode OTP ke email resmi Telkom University untuk verifikasi login/pendaftaran.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "mahasiswa@student.telkomuniversity.ac.id"
      responses:
        '200':
          description: OTP berhasil dikirim ke email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "OTP berhasil dikirim ke email Anda."
        '403':
          description: Menggunakan email di luar domain Telkom University.
        '500':
          description: Gagal mengirim OTP atau kesalahan server.

  /auth/otp/verify:
    post:
      tags:
        - Public Auth
      summary: Verify OTP code
      description: Memverifikasi kode OTP yang dikirim ke email. Jika valid, pengguna otomatis masuk/terdaftar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: "mahasiswa@student.telkomuniversity.ac.id"
                otp:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Verifikasi OTP berhasil, cookie auth_token telah diset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  user:
                    $ref: '#/components/schemas/UserBasic'
        '400':
          description: Kode OTP salah atau sudah kedaluwarsa.
        '404':
          description: Belum melakukan request OTP untuk email tersebut.
        '500':
          description: Terjadi kesalahan server.

  # ================= PROTECTED ROUTES =================
  /account/link-google:
    post:
      tags:
        - Protected Auth & Accounts
      summary: Link Google Account
      description: Menghubungkan akun Google ke akun pengguna yang sedang login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - googleToken
                - userId
              properties:
                googleToken:
                  type: string
                  example: "ya29.a0AeD3V_..."
                userId:
                  type: string
                  example: "clzxxxxxx0000xxxx"
      responses:
        '200':
          description: Akun Google berhasil ditautkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Google account successfully linked"
                  email:
                    type: string
                    example: "user@gmail.com"
        '400':
          description: Parameter tidak lengkap atau email sudah terhubung ke akun lain.
        '500':
          description: Gagal menautkan akun Google.

  /account/unlink-google:
    post:
      tags:
        - Protected Auth & Accounts
      summary: Unlink Google Account
      description: Memutuskan tautan akun Google dari akun pengguna yang sedang login.
      responses:
        '200':
          description: Berhasil memutuskan tautan akun Google.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Google account successfully unlinked"
                  email:
                    type: string
                    nullable: true
                    example: null
        '500':
          description: Gagal memutuskan tautan.

  /users:
    get:
      tags:
        - Protected Users
      summary: Get all users
      description: Mengambil daftar seluruh pengguna.
      responses:
        '200':
          description: Berhasil memuat daftar pengguna.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Users fetched successfully"
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserFull'
        '500':
          description: Gagal mengambil data pengguna.

  /register-user:
    post:
      tags:
        - Protected Users
      summary: Register a new user (Admin Only)
      description: Mendaftarkan user baru ke dalam sistem. Akses dibatasi untuk Super Admin / Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - name
                - role
                - unitId
              properties:
                username:
                  type: string
                  example: "tpa_finance"
                password:
                  type: string
                  example: "AdminSecret123"
                name:
                  type: string
                  example: "Rofi"
                role:
                  type: string
                  enum: [super_admin, admin, dekanat, wadek, kaur, kaprodi, mahasiswa, tpa]
                  example: "tpa"
                supervisorId:
                  type: integer
                  nullable: true
                  example: 1
                unitId:
                  type: integer
                  example: 2
      responses:
        '201':
          description: User berhasil didaftarkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User created successfuly"
                  user:
                    $ref: '#/components/schemas/UserFull'
        '400':
          description: Data input tidak lengkap.
        '409':
          description: Username sudah digunakan.
        '500':
          description: Terjadi kesalahan server.

  /users/me:
    get:
      tags:
        - Protected Users
      summary: Get current user profile
      description: Mengambil detail profil dari user yang sedang terautentikasi (berdasarkan token sesi).
      responses:
        '200':
          description: Profil berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User fetched successfully"
                  user:
                    $ref: '#/components/schemas/UserFull'
        '404':
          description: User tidak ditemukan.
        '500':
          description: Terjadi kesalahan server.
    patch:
      tags:
        - Protected Users
      summary: Update own profile
      description: Memperbarui informasi profil pengguna yang sedang login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "ahmad_new"
                name:
                  type: string
                  example: "Ahmad Sidik Rofi"
                password:
                  type: string
                  example: "newSecretPassword123"
                avatarUrl:
                  type: string
                  example: "https://xxxx.vercel-storage.com/profiles/avatar.png"
      responses:
        '200':
          description: Profil berhasil diperbarui. Cookie token diperbarui.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile updated successfully"
                  user:
                    $ref: '#/components/schemas/UserFull'
        '400':
          description: Username sudah digunakan atau tidak ada perubahan data.
        '500':
          description: Terjadi kesalahan server.

  /users/upload-avatar:
    post:
      tags:
        - Protected Users
      summary: Upload avatar image
      description: Mengunggah gambar avatar (Maksimal 2MB, format JPEG/PNG/WEBP) ke Vercel Blob storage.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: File foto profil / avatar.
      responses:
        '200':
          description: Foto berhasil diunggah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Photo succeded uploaded"
                  url:
                    type: string
                    example: "https://xxxx.vercel-storage.com/profiles/1715830000-avatar.png"
        '400':
          description: Tidak ada file yang diunggah.
        '500':
          description: Gagal mengunggah file.

  /users/delete-avatar:
    delete:
      tags:
        - Protected Users
      summary: Delete avatar image
      description: Menghapus avatar aktif dari Vercel Blob dan mengosongkan avatarUrl di profil user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - avatarUrl
              properties:
                avatarUrl:
                  type: string
                  example: "https://xxxx.vercel-storage.com/profiles/1715830000-avatar.png"
      responses:
        '200':
          description: Avatar berhasil dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile picture deleted successfully"
                  user:
                    $ref: '#/components/schemas/UserFull'
        '500':
          description: Gagal menghapus foto profil.

  /users/{id}:
    put:
      tags:
        - Protected Users
      summary: Update user (Admin Only)
      description: Mengubah detail data pengguna lain berdasarkan ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID User yang akan diupdate.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum: [super_admin, admin, dekanat, wadek, kaur, kaprodi, mahasiswa, tpa]
                supervisorId:
                  type: integer
                  nullable: true
                unitId:
                  type: integer
                  nullable: true
                password:
                  type: string
      responses:
        '200':
          description: Pengguna berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User updated successfully"
                  user:
                    $ref: '#/components/schemas/UserFull'
        '500':
          description: Gagal memperbarui data user.
    delete:
      tags:
        - Protected Users
      summary: Delete user (Admin Only)
      description: Menghapus pengguna dari sistem berdasarkan ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID User yang akan dihapus.
          schema:
            type: string
      responses:
        '200':
          description: Pengguna berhasil dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User deleted successfully"
                  user:
                    $ref: '#/components/schemas/UserFull'
        '500':
          description: Gagal menghapus user.

  /sign-out:
    post:
      tags:
        - Protected Users
      summary: Sign out / Log out
      description: Menghapus cookie `auth_token` untuk mengakhiri sesi pengguna.
      responses:
        '200':
          description: Logout berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logout berhasil"

  # ================= NEED WHATSAPP : HANDLE LATER =================
  /tickets:
    get:
      tags:
        - Protected Tickets
      summary: Get all tickets (Admin Only)
      description: Mengambil semua daftar tiket pengaduan masuk, opsional difilter berdasarkan status.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter status tiket.
          schema:
            type: string
            example: "open"
      responses:
        '200':
          description: Daftar tiket berhasil dimuat.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '500':
          description: Gagal mengambil daftar tiket.

  /tickets/{id}/assign:
    put:
      tags:
        - Protected Tickets
      summary: Assign ticket to Admin (Admin Only)
      description: Menugaskan tiket pengaduan ke admin tertentu untuk mulai ditangani.
      parameters:
        - name: id
          in: path
          required: true
          description: ID Tiket.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - adminName
              properties:
                adminName:
                  type: string
                  example: "Admin Budi"
      responses:
        '200':
          description: Tiket berhasil ditugaskan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Parameter adminName wajib diisi.
        '500':
          description: Gagal menugaskan tiket.

  /tickets/{id}/resolve:
    put:
      tags:
        - Protected Tickets
      summary: Resolve ticket by Admin (Admin Only)
      description: Menyelesaikan tiket pengaduan secara langsung oleh admin.
      parameters:
        - name: id
          in: path
          required: true
          description: ID Tiket.
          schema:
            type: string
      responses:
        '200':
          description: Tiket berhasil diselesaikan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '500':
          description: Gagal menyelesaikan tiket.

  /dashboard/stats:
    get:
      tags:
        - Protected Tickets
      summary: Get Dashboard Stats (Admin Only)
      description: Mengambil data ringkasan statistik tiket pengaduan untuk dashboard admin.
      responses:
        '200':
          description: Berhasil memuat statistik dashboard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 120
                  open:
                    type: integer
                    example: 15
                  inProgress:
                    type: integer
                    example: 25
                  resolved:
                    type: integer
                    example: 80
        '500':
          description: Gagal mengambil statistik.

  /dashboard/stats/ticket-categories:
    get:
      tags:
        - Protected Tickets
      summary: Get Ticket Category Stats (Admin Only)
      description: Mengambil data jumlah tiket per kategori pengaduan.
      responses:
        '200':
          description: Statistik kategori berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                example:
                  Sarana & Prasarana: 45
                  Akademik: 30
                  Kemahasiswaan: 25
        '500':
          description: Gagal memuat data statistik kategori.

  /dashboard/stats/ticket-trends:
    get:
      tags:
        - Protected Tickets
      summary: Get Ticket Trends (Admin Only)
      description: Mengambil data tren kenaikan/penurunan jumlah tiket dalam kurun waktu tertentu.
      parameters:
        - name: period
          in: query
          required: false
          description: Periode hari (default 7 hari).
          schema:
            type: integer
            default: 7
            example: 7
      responses:
        '200':
          description: Data tren tiket berhasil didapatkan.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                      example: "2026-05-18"
                    count:
                      type: integer
                      example: 8
        '500':
          description: Gagal mengambil tren tiket.

  /conversations/{id}:
    get:
      tags:
        - Protected Tickets
      summary: Get Conversation Segment (Admin Only)
      description: Mengambil segmen percakapan atau detail obrolan relevan terkait tiket pengaduan.
      parameters:
        - name: id
          in: path
          required: true
          description: ID Percakapan / Conversation.
          schema:
            type: string
      responses:
        '200':
          description: Segmen percakapan berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationSegment:
                    type: object
                    description: Informasi terperinci segmen pesan obrolan.
        '404':
          description: Percakapan tidak ditemukan atau tidak memiliki tiket aktif.
        '500':
          description: Gagal memuat obrolan.

  /schedules:
    get:
      tags:
        - Protected Schedules
      summary: Get schedules list
      description: Mengambil seluruh daftar jadwal reminder aktif berdasarkan bulan berjalan.
      responses:
        '200':
          description: Daftar jadwal berhasil didapatkan.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '500':
          description: Gagal mengambil data jadwal.
    post:
      tags:
        - Protected Schedules
      summary: Create reminder schedule
      description: Membuat jadwal pengingat (reminder) baru lengkap dengan judul, deskripsi, dan penerima WhatsApp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipients
                - eventTitle
                - eventDescription
                - eventTime
                - reminderTime
                - createdBy
              properties:
                recipients:
                  type: array
                  items:
                    type: string
                  description: Daftar nomor WhatsApp atau email penerima pengingat.
                  example: ["081234567890", "089876543210"]
                eventTitle:
                  type: string
                  example: "Ujian Akhir Semester"
                eventDescription:
                  type: string
                  example: "Jangan lupa untuk mempersiapkan kartu ujian sebelum masuk ruang kelas."
                eventTime:
                  type: string
                  format: date-time
                  example: "2026-06-15T08:00:00Z"
                reminderTime:
                  type: string
                  format: date-time
                  example: "2026-06-14T08:00:00Z"
                createdBy:
                  type: string
                  example: "admin_akademik"
      responses:
        '201':
          description: Jadwal pengingat berhasil dibuat.
          content:
            application/json:
