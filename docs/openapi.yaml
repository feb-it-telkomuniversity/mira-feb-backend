      tags:
        - Protected Units
      summary: Get all structural units
      description: Mengambil seluruh daftar unit struktural di lingkungan FEB Telkom University.
      parameters:
        - name: search
          in: query
          required: false
          description: Cari unit berdasarkan nama.
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Filter unit berdasarkan tipe kategori.
          schema:
            type: string
      responses:
        '200':
          description: Daftar unit struktural berhasil dimuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Units fetched successfully"
                  units:
                    type: array
                    items:
                      $ref: '#/components/schemas/Unit'
        '500':
          description: Terjadi kesalahan server.
    post:
      tags:
        - Protected Units
      summary: Create new structural unit
      description: Menambahkan data unit struktural baru ke dalam sistem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
              properties:
                name:
                  type: string
                  example: "Prodi S1 Akuntansi"
                category:
                  type: string
                  enum: [Fakultas, Wadek, KK, Prodi, Kaur, Umum]
                  example: "Prodi"
      responses:
        '201':
          description: Unit struktural baru berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Unit created successfully"
                  data:
                    $ref: '#/components/schemas/Unit'
        '400':
          description: Nama unit atau kategori unit kosong.
        '500':
          description: Gagal menyimpan data unit.

  /units/{id}:
    put:
      tags:
        - Protected Units
      summary: Update structural unit by ID
      description: Memperbarui data nama atau kategori unit struktural berdasarkan ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Prodi S1 Akuntansi (Revisi)"
                category:
                  type: string
                  enum: [Fakultas, Wadek, KK, Prodi, Kaur, Umum]
                  example: "Prodi"
      responses:
        '200':
          description: Data unit struktural berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Unit updated successfully"
                  data:
                    $ref: '#/components/schemas/Unit'
        '400':
          description: Payload kosong / tidak ada data yang diperbarui.
        '404':
          description: Unit tidak ditemukan.
        '500':
          description: Gagal memperbarui data.
    delete:
      tags:
        - Protected Units
      summary: Delete structural unit by ID
      description: Menghapus data unit struktural dari sistem secara permanen berdasarkan ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Unit struktural berhasil dihapus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Unit deleted successfully"
        '400':
          description: Gagal menghapus unit karena masih memiliki relasi aktif ke Pengguna atau Kontrak Kinerja.
        '404':
          description: Unit tidak ditemukan.
        '500':
          description: Terjadi kesalahan.

